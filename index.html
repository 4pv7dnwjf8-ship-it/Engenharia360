        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

              bytes.push(b & 0xff);

          }
        }
      }

const timerDuration = 5 * 60 * 1000;
let timerRemaining = timerDuration;
let timerDeadline = 0;
let timerInterval = null;
let timerRunning = false;
function paintTimer() {
 const seconds = Math.ceil(timerRemaining / 1000);
 root.querySelector('#talk-time').textContent = String(Math.floor(seconds / 60)).padStart(2,'0') + ':' + String(seconds % 60).padStart(2,'0');
 const ended = timerRemaining <= 0;
 const warning = timerRemaining <= 60000 && !ended;
 root.querySelector('#talk-timer').dataset.state = ended ? 'finished' : warning ? 'warning' : 'running';
 const message = ended ? 'Tempo encerrado' : !timerRunning ? 'Pausado' : warning ? 'Último minuto' : 'Em andamento';
 const status = root.querySelector('#talk-status');
 if (status.textContent !== message) status.textContent = message;
}
function tickTimer() {
 if (timerRunning) timerRemaining = Math.max(0, timerDeadline - Date.now());
 if (timerRemaining === 0) {timerRunning = false; clearInterval(timerInterval); timerInterval = null;}
 paintTimer();
}
function pauseTimer() {
 if (!timerRunning) return;
 timerRemaining = Math.max(0, timerDeadline - Date.now());
 timerRunning = false; clearInterval(timerInterval); timerInterval = null; paintTimer();
}
function resumeTimer() {
 if (timerRunning || timerRemaining <= 0) return;
 timerDeadline = Date.now() + timerRemaining;
 timerRunning = true;
 timerInterval = setInterval(tickTimer, 200);
 tickTimer();
}
function resetTimer() {
 clearInterval(timerInterval); timerInterval = null; timerRunning = false;
 timerRemaining = timerDuration;
 resumeTimer();
}
root.querySelector('#presentation-dialog').addEventListener('close',pauseTimer);
root.querySelector('#presentation-dialog').addEventListener('cancel',pauseTimer);
this.stopPresentationTimer = pauseTimer;


let ownsFullscreen = false;
const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function refreshFullscreen() {
 const active = Boolean(fullscreenElement());
 const button = root.querySelector('#toggle-fullscreen');
 button.setAttribute('aria-pressed', String(active));
 button.setAttribute('aria-label', active ? 'Sair da tela cheia' : 'Ativar tela cheia');
 root.querySelector('#fullscreen-label').textContent = active ? 'Sair da tela cheia' : 'Tela cheia';
 if (!active) ownsFullscreen = false;
}
async function exitPresentationFullscreen() {
 if (!ownsFullscreen || !fullscreenElement()) return;
 const exit = document.exitFullscreen || document.webkitExitFullscreen;
 try { if (exit) await exit.call(document); } catch (_) {}
 ownsFullscreen = false; refreshFullscreen();
}
async function togglePresentationFullscreen() {
 const feedback = root.querySelector('#fullscreen-feedback');
 feedback.textContent = '';
 const target = document.documentElement;
 const enter = target.requestFullscreen || target.webkitRequestFullscreen;
 const exit = document.exitFullscreen || document.webkitExitFullscreen;
 try {
  if (fullscreenElement()) {
   if (exit) await exit.call(document);
   ownsFullscreen = false;
  } else if (enter) {
   await enter.call(target);
   ownsFullscreen = Boolean(fullscreenElement());
  } else {
   feedback.textContent = 'Tela cheia indisponível neste navegador. A apresentação continua ajustada à tela.';
  }
 } catch (_) {
  feedback.textContent = 'Não foi possível ativar a tela cheia neste navegador. A apresentação continua ajustada à tela.';
 }
 refreshFullscreen();
}
root.querySelector('#toggle-fullscreen').addEventListener('click', togglePresentationFullscreen);
document.addEventListener('fullscreenchange', refreshFullscreen);
document.addEventListener('webkitfullscreenchange', refreshFullscreen);
root.querySelector('#presentation-dialog').addEventListener('close', exitPresentationFullscreen);
this.removeFullscreenListeners = () => {
 document.removeEventListener('fullscreenchange', refreshFullscreen);
 document.removeEventListener('webkitfullscreenchange', refreshFullscreen);
 exitPresentationFullscreen();
};

let currentSlide=0;
function renderPresentationSlide() {
  root.querySelector('#presentation-stage').innerHTML = presentationSlides[currentSlide];
  root.querySelector('#slide-number').textContent = String(currentSlide + 1).padStart(2, '0') + ' / ' + String(presentationSlides.length).padStart(2, '0');
  root.querySelector('#slide-progress').style.width = (((currentSlide + 1) / presentationSlides.length) * 100) + '%';
  root.querySelector('#previous-slide').disabled = currentSlide === 0;
  const next = root.querySelector('#next-slide');
  const isLast = currentSlide === presentationSlides.length - 1;
  next.textContent = isLast ? '✓' : '→';
  next.setAttribute('aria-label', isLast ? 'Encerrar apresentação' : 'Próxima tela');
  const demoReveal = root.querySelector('#demo-reveal');
  if (demoReveal) demoReveal.addEventListener('click', () => {
    root.querySelectorAll('.demo-course').forEach(label => { label.hidden = false; });
    root.querySelector('#demo-connection').hidden = false;
    demoReveal.setAttribute('aria-expanded','true');
    demoReveal.textContent = 'Cinco caminhos para explorar';
    demoReveal.disabled = true;
  });
}

function openPresentation() {
  currentSlide = 0;
  renderPresentationSlide();
  root.querySelector('#presentation-dialog').showModal();
  resetTimer();

}

function closePresentation() {
  pauseTimer();
  root.querySelector('#presentation-dialog').close();

}

function nextSlide() {
  if (currentSlide === presentationSlides.length - 1) {
    closePresentation();
    return;
  }
  currentSlide += 1;
  renderPresentationSlide();
}

function previousSlide() {
  if (currentSlide === 0) return;
  currentSlide -= 1;
  renderPresentationSlide();
}


root.querySelector('#open-presentation').addEventListener('click',openPresentation);
root.querySelector('#close-presentation').addEventListener('click',closePresentation);
root.querySelector('#next-slide').addEventListener('click',nextSlide);
root.querySelector('#previous-slide').addEventListener('click',previousSlide);
root.querySelector('.presentation-brand').addEventListener('click',e=>e.preventDefault());
root.addEventListener('keydown',event=>{
 if(!root.querySelector('#presentation-dialog').open)return;
 if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();nextSlide()}
 if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();previousSlide()}
});

} else {
 root.querySelector('#qr-help').textContent = 'O QR code estará disponível ao abrir esta apresentação pelo endereço on-line.';
}
if (location.hash === '#apresentar') openPresentation();

}
disconnectedCallback(){this.stopPresentationTimer?.();this.removeFullscreenListeners?.();}
});
