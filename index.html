const root=this.attachShadow({mode:'open'});
root.innerHTML="<style>:host { --ink:#071b2b; --mint:#3ee3b6; --orange:#ff9f43; --blue:#4f7cff; font:16px system-ui,sans-serif; }\n*{box-sizing:border-box} button{font:inherit;cursor:pointer} a{color:inherit;text-decoration:none} svg{display:block} :focus-visible{outline:3px solid #3ee3b6;outline-offset:4px}\n.brand { display: inline-flex; align-items: center; gap: 10px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.7px; }\n.brand > span:last-child > span { color: var(--mint); }\n.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: rgba(62, 227, 182, .12); display: grid; place-items: center; color: var(--mint); }\n.brand-mark svg { width: 25px; fill: none; stroke: currentColor; stroke-width: 1.7; }\n.eyebrow { margin: 0 0 18px; color: var(--mint-bright); text-transform: uppercase; letter-spacing: 2.1px; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 10px; }\n.eyebrow span { width: 28px; height: 1px; background: currentColor; }\n.avatar { flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 800 10px Manrope, sans-serif; }\n.avatar-mec { background: #fff0df; color: #c76818; }\n.avatar-civil { background: #dff7f0; color: #15765f; }\n.avatar-ele { background: #e9efff; color: #3c64d4; }\n.presentation-dialog { width: 100%; max-width: none; height: 100%; max-height: none; margin: 0; padding: 0; border: 0; color: white; background: var(--ink); }\n.presentation-dialog::backdrop { background: rgba(2,10,17,.85); backdrop-filter: blur(8px); }\n.presentation-dialog[open] { animation: dialogIn .28s ease both; }\n.presentation-shell { min-height: 100%; display: grid; grid-template-rows: 74px 1fr 76px; background: radial-gradient(circle at 82% 15%, rgba(21,92,92,.42), transparent 30%), radial-gradient(circle at 9% 90%, rgba(52,84,152,.16), transparent 28%), var(--ink); }\n.presentation-header { display: grid; grid-template-columns: 1fr minmax(220px,360px) 1fr; align-items: center; gap: 25px; padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,.1); }\n.presentation-brand { justify-self: start; }\n.presentation-close { justify-self: end; color: white; background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.15); }\n.slide-status { display: flex; align-items: center; gap: 13px; color: rgba(255,255,255,.52); font-size: 10px; }\n.slide-status > div { flex: 1; height: 4px; overflow: hidden; background: rgba(255,255,255,.1); border-radius: 99px; }\n.slide-status i { display: block; width: 14.28%; height: 100%; background: var(--mint); border-radius: inherit; transition: width .3s ease; }\n.presentation-stage { width: min(calc(100% - 80px), 1180px); margin: auto; padding: 46px 0; display: grid; align-items: center; }\n.slide { display: grid; gap: 48px; align-items: center; animation: slideIn .32s ease both; }\n.slide-cover { grid-template-columns: 1.1fr .9fr; }\n.slide-copy .eyebrow { margin-bottom: 20px; }\n.slide-copy h1 { max-width: 820px; margin: 0; font: 800 clamp(48px,6.8vw,88px)/.98 Manrope, sans-serif; letter-spacing: -5px; }\n.slide-copy h1 em { color: var(--mint); font-style: normal; }\n.slide-copy h2 { max-width: 850px; margin: 0; font: 800 clamp(40px,5vw,67px)/1.05 Manrope, sans-serif; letter-spacing: -3.5px; }\n.slide-copy > p { max-width: 720px; margin: 22px 0 0; color: rgba(255,255,255,.62); font-size: 17px; line-height: 1.65; }\n.cover-tag { display: inline-flex; margin-top: 30px; padding: 9px 13px; border: 1px solid rgba(62,227,182,.32); border-radius: 99px; color: var(--mint); background: rgba(62,227,182,.07); font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; font-weight: 800; }\n.cover-graphic { height: min(47vw,460px); max-height: 460px; position: relative; display: grid; place-items: center; }\n.cover-orbit { position: absolute; width: 78%; aspect-ratio: 1; border: 1px solid rgba(255,255,255,.1); border-radius: 50%; }\n.cover-orbit:before, .cover-orbit:after { content: \"\"; position: absolute; inset: 15%; border: inherit; border-radius: inherit; transform: rotateX(62deg) rotate(28deg); }\n.cover-orbit:after { transform: rotateY(66deg) rotate(-22deg); }\n.cover-core { width: 160px; height: 160px; display: grid; place-items: center; border-radius: 50%; color: var(--mint); background: radial-gradient(circle at 35% 30%, #1a5d5c, #0a2635); border: 1px solid rgba(62,227,182,.42); box-shadow: 0 0 80px rgba(62,227,182,.2); }\n.cover-core svg { width: 78px; fill: none; stroke: currentColor; stroke-width: 1; }\n.slide-layout { grid-template-columns: .85fr 1.15fr; }\n.slide-question { padding-left: 28px; border-left: 3px solid var(--mint); color: rgba(255,255,255,.9); font: 700 clamp(23px,3vw,38px)/1.4 Manrope, sans-serif; }\n.slide-cards { display: grid; gap: 13px; }\n.slide-card { padding: 23px; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; background: rgba(255,255,255,.055); }\n.slide-card span { color: var(--mint); text-transform: uppercase; font-size: 9px; letter-spacing: 1.3px; font-weight: 800; }\n.slide-card h3 { margin: 7px 0 7px; font: 800 19px Manrope, sans-serif; }\n.slide-card p { margin: 0; color: rgba(255,255,255,.53); line-height: 1.5; font-size: 12px; }\n.slide-objective-box { padding: 34px; border-radius: 23px; background: linear-gradient(135deg, rgba(62,227,182,.14), rgba(255,255,255,.055)); border: 1px solid rgba(62,227,182,.22); }\n.slide-objective-box span { color: var(--mint); text-transform: uppercase; letter-spacing: 1.5px; font-size: 10px; font-weight: 800; }\n.slide-objective-box p { margin: 14px 0 0; font: 600 clamp(20px,2.3vw,30px)/1.5 Manrope, sans-serif; }\n.slide-points { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.slide-point { padding: 20px; border-radius: 16px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); }\n.slide-point b { display: block; margin-bottom: 7px; color: var(--mint); font: 800 11px Manrope, sans-serif; }\n.slide-point span { color: rgba(255,255,255,.58); font-size: 12px; line-height: 1.45; }\n.slide-flow { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }\n.flow-item { min-height: 215px; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; border-radius: 22px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.12); }\n.flow-item > b { margin-bottom: auto; color: var(--mint); font: 800 13px Manrope, sans-serif; }\n.flow-item h3 { margin: 22px 0 7px; font: 800 22px Manrope, sans-serif; }\n.flow-item p { margin: 0; color: rgba(255,255,255,.5); line-height: 1.5; font-size: 11px; }\n.slide-timeline { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; position: relative; }\n.slide-timeline:before { content: \"\"; position: absolute; left: 7%; right: 7%; top: 22px; height: 1px; background: rgba(255,255,255,.16); }\n.timeline-step { position: relative; }\n.timeline-step > b { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid rgba(62,227,182,.5); border-radius: 50%; color: var(--mint); background: var(--ink); font: 800 12px Manrope, sans-serif; }\n.timeline-step h3 { margin: 25px 0 8px; font: 800 18px Manrope, sans-serif; }\n.timeline-step p { margin: 0; color: rgba(255,255,255,.5); line-height: 1.5; font-size: 11px; }\n.school-panel { display: grid; grid-template-columns: .9fr 1.1fr; gap: 16px; }\n.school-name { min-height: 280px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 24px; background: var(--mint); color: var(--ink); }\n.school-name span { text-transform: uppercase; letter-spacing: 1.5px; font-size: 9px; font-weight: 800; }\n.school-name h3 { margin: 0; font: 800 clamp(28px,3vw,40px)/1.1 Manrope, sans-serif; letter-spacing: -1.7px; }\n.school-name small { font-size: 11px; }\n.school-activity { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.school-activity div { padding: 21px; border-radius: 18px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); }\n.school-activity b { display: block; color: var(--mint); font: 800 11px Manrope, sans-serif; }\n.school-activity p { margin: 8px 0 0; color: rgba(255,255,255,.54); line-height: 1.45; font-size: 11px; }\n.results-list { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; }\n.result-card { min-height: 230px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 21px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.11); }\n.result-card > span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: rgba(62,227,182,.12); color: var(--mint); font-weight: 800; }\n.result-card h3 { margin: 24px 0 8px; font: 800 19px Manrope, sans-serif; }\n.result-card p { margin: 0; color: rgba(255,255,255,.5); font-size: 11px; line-height: 1.5; }\n.team-slide-list { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }\n.team-slide-list div { display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-radius: 15px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); }\n.team-slide-list b { display: block; font-size: 12px; }\n.team-slide-list small { display: block; margin-top: 3px; color: rgba(255,255,255,.46); font-size: 9px; }\n.presentation-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-top: 1px solid rgba(255,255,255,.1); background: transparent; }\n.keyboard-tip { color: rgba(255,255,255,.38); font-size: 10px; }\n.presentation-controls > div { display: flex; gap: 8px; }\n.slide-nav { width: 46px; height: 46px; border: 1px solid rgba(255,255,255,.16); border-radius: 13px; background: rgba(255,255,255,.05); color: white; cursor: pointer; font-size: 19px; }\n.slide-nav-next { background: var(--mint); color: var(--ink); border-color: var(--mint); }\n.slide-nav:disabled { opacity: .25; cursor: not-allowed; }\n@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }\n\n#open-presentation{background:var(--ink);color:white;padding:16px 24px;border:0;border-radius:13px;font-weight:700}\n.dialog-close{width:44px;height:44px;border:1px solid #ffffff55;border-radius:12px;font-size:28px}\n.presentation-dialog{font:16px system-ui,sans-serif}\n.slide-copy h1,.slide-copy h2{letter-spacing:-.035em;overflow-wrap:anywhere}\n.slide-card p,.slide-point span,.flow-item p,.timeline-step p,.school-activity p,.result-card p{font-size:1rem;color:#c6d5dc}\n.slide-card span,.slide-point b,.school-activity b,.cover-tag,.school-name span,.school-name small,.team-slide-list b,.team-slide-list small,.slide-status,.keyboard-tip{font-size:.875rem}\n.slide-card p{margin-top:12px}.slide{min-width:0}.slide>*{min-width:0}.slide-copy .eyebrow{color:var(--mint);font-size:.875rem}.slide-question{margin-top:24px}\n@media(max-width:850px){.presentation-header{grid-template-columns:1fr auto;padding:14px;gap:12px}.slide-status{grid-row:2;grid-column:1/-1}.presentation-shell{grid-template-rows:auto 1fr 76px}.presentation-stage{width:calc(100% - 32px);padding:30px 0}.slide,.slide-layout,.slide-cover{grid-template-columns:1fr;gap:28px}.slide-copy h1{font-size:clamp(36px,9vw,60px)}.slide-copy h2{font-size:clamp(30px,7vw,48px)}.slide-timeline,.results-list,.slide-flow,.school-panel{grid-template-columns:1fr}.slide-timeline:before{display:none}.cover-graphic{height:240px}.presentation-controls{padding:0 16px}}\n@media(max-width:480px){.slide-points,.school-activity,.team-slide-list{grid-template-columns:1fr}.cover-core{width:100px;height:100px}.cover-core svg{width:52px}.brand{font-size:16px}.slide-objective-box{padding:22px}.slide-copy>p{font-size:1rem}}\n@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}\n</style><button type=\"button\" id=\"open-presentation\">Abrir apresentação • Engenharia360</button><dialog class=\"presentation-dialog\" id=\"presentation-dialog\" aria-label=\"Apresentação do projeto Engenharia360\">\n    <div class=\"presentation-shell\">\n      <header class=\"presentation-header\">\n        <a class=\"brand presentation-brand\" href=\"#\" aria-label=\"Engenharia360\"><span class=\"brand-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 40\"><path d=\"M9 10.5 20 4l11 6.5v19L20 36 9 29.5z\"/><path d=\"m9 10.5 11 6.4 11-6.4M20 16.9V36\"/></svg></span><span>Engenharia<span>360</span></span></a>\n        <div class=\"slide-status\"><span id=\"slide-number\">01 / 07</span><div><i id=\"slide-progress\"></i></div></div>\n        <button class=\"dialog-close presentation-close\" id=\"close-presentation\" type=\"button\" aria-label=\"Fechar apresentação\">×</button>\n      </header>\n      <main class=\"presentation-stage\" id=\"presentation-stage\" aria-live=\"polite\"></main>\n      <footer class=\"presentation-controls\">\n        <span class=\"keyboard-tip\">Use ← → para navegar</span>\n        <div>\n          <button class=\"slide-nav\" id=\"previous-slide\" type=\"button\" aria-label=\"Tela anterior\">←</button>\n          <button class=\"slide-nav slide-nav-next\" id=\"next-slide\" type=\"button\" aria-label=\"Próxima tela\">→</button>\n        </div>\n      </footer>\n    </div>\n  </dialog>";
const presentationSlides = [
  '<section class="slide slide-cover"><div class="slide-copy"><p class="eyebrow"><span></span> Projeto Interdisciplinar • ULBRA Manaus</p><h1>Engenharia<em>360</em></h1><p>Uma plataforma interativa que testa afinidades com as Engenharias Civil, Mecânica, Elétrica, Química e Ambiental e Sanitária.</p><span class="cover-tag">Orientação universitária acessível</span></div><div class="cover-graphic" aria-hidden="true"><span class="cover-orbit"></span><span class="cover-core"><svg viewBox="0 0 40 40"><path d="M9 10.5 20 4l11 6.5v19L20 36 9 29.5z"/><path d="m9 10.5 11 6.4 11-6.4M20 16.9V36"/></svg></span></div></section>',
  '<section class="slide slide-layout"><div class="slide-copy"><p class="eyebrow"><span></span> Ponto de partida</p><h2>Qual problema queremos resolver?</h2><p>As engenharias fazem parte do cotidiano, mas suas diferenças nem sempre são apresentadas de forma simples a quem ainda está escolhendo um curso.</p><div class="slide-question">Como transformar informação em uma experiência que ajude o estudante a se reconhecer?</div></div><div class="slide-cards"><article class="slide-card"><span>01 • Informação</span><h3>Conteúdo muito técnico</h3><p>Termos complexos podem afastar quem está tendo o primeiro contato com a área.</p></article><article class="slide-card"><span>02 • Escolha</span><h3>Dificuldade de comparação</h3><p>O estudante precisa enxergar, de forma prática, o que aproxima e diferencia cada curso.</p></article><article class="slide-card"><span>03 • Experiência</span><h3>Pouca identificação</h3><p>Conhecer profissões fica mais claro quando o conteúdo se conecta a interesses pessoais.</p></article></div></section>',
  '<section class="slide slide-layout"><div class="slide-copy"><p class="eyebrow"><span></span> Direção do projeto</p><h2>Objetivos</h2><p>O Engenharia360 informa, envolve e orienta sem tentar decidir pelo estudante.</p><div class="slide-objective-box"><span>Objetivo geral</span><p>Desenvolver e aplicar uma plataforma digital interativa que aproxime estudantes do Ensino Médio de cinco áreas da engenharia: Civil, Mecânica, Elétrica, Química e Ambiental e Sanitária.</p></div></div><div class="slide-points"><div class="slide-point"><b>01 • Apresentar</b><span>Explicar os cursos com linguagem simples e visual.</span></div><div class="slide-point"><b>02 • Identificar</b><span>Relacionar interesses a situações próprias das engenharias.</span></div><div class="slide-point"><b>03 • Recomendar</b><span>Oferecer caminhos para continuar explorando.</span></div><div class="slide-point"><b>04 • Avaliar</b><span>Observar compreensão e interesse durante a aplicação.</span></div></div></section>',
  '<section class="slide"><div class="slide-copy"><p class="eyebrow"><span></span> Experiência do estudante</p><h2>Como a plataforma funciona</h2><p>Uma jornada curta, sem cadastro e com resultado imediato.</p></div><div class="slide-flow"><article class="flow-item"><b>01</b><h3>Responder</h3><p>O estudante escolhe como agiria em nove situações relacionadas a problemas reais.</p></article><article class="flow-item"><b>02</b><h3>Descobrir</h3><p>As escolhas formam um mapa percentual de afinidades entre as cinco engenharias: Civil, Mecânica, Elétrica, Química e Ambiental e Sanitária.</p></article><article class="flow-item"><b>03</b><h3>Explorar</h3><p>O resultado explica a afinidade e recomenda experiências e próximos passos.</p></article></div></section>',
  '<section class="slide"><div class="slide-copy"><p class="eyebrow"><span></span> Caminho de desenvolvimento</p><h2>Metodologia</h2><p>Conteúdo, experiência e tecnologia foram organizados em quatro etapas.</p></div><div class="slide-timeline"><article class="timeline-step"><b>1</b><h3>Pesquisa</h3><p>Levantamento das características dos cursos e das necessidades do público.</p></article><article class="timeline-step"><b>2</b><h3>Desenvolvimento</h3><p>Criação das perguntas, lógica de pontuação, conteúdo e interface.</p></article><article class="timeline-step"><b>3</b><h3>Validação</h3><p>Testes de clareza, funcionamento, navegação e adaptação a celulares.</p></article><article class="timeline-step"><b>4</b><h3>Aplicação</h3><p>Apresentação guiada, teste individual e conversa sobre os resultados.</p></article></div></section>',
  '<section class="slide slide-layout"><div class="slide-copy"><p class="eyebrow"><span></span> Atividade com o público</p><h2>Aplicação e resultados esperados</h2><p>A experiência será conduzida de forma educativa, acolhendo dúvidas e evitando tratar o resultado como uma decisão definitiva.</p><div class="school-panel"><div class="school-name"><span>Local da atividade</span><h3>Escola Estadual Nathália Uchôa</h3><small>Manaus • Amazonas</small></div><div class="school-activity"><div><b>1 • Contextualizar</b><p>Apresentaremos aos alunos as Engenharias Civil, Mecânica, Elétrica, Química e Ambiental e Sanitária.</p></div><div><b>2 • Experimentar</b><p>Realizar o teste individualmente.</p></div><div><b>3 • Conversar</b><p>Comparar resultados e tirar dúvidas.</p></div><div><b>4 • Refletir</b><p>Reconhecer interesses e novos caminhos.</p></div></div></div></div><div class="results-list"><article class="result-card"><span>✓</span><div><h3>Compreensão</h3><p>Entender melhor o que cada engenharia transforma.</p></div></article><article class="result-card"><span>✓</span><div><h3>Identificação</h3><p>Perceber interesses e habilidades pessoais.</p></div></article><article class="result-card"><span>✓</span><div><h3>Autonomia</h3><p>Explorar a escolha acadêmica com mais consciência.</p></div></article></div></section>',
  '<section class="slide slide-layout"><div class="slide-copy"><p class="eyebrow"><span></span> Encerramento</p><h2>Conhecer para escolher melhor.</h2><p>O Engenharia360 não entrega uma resposta definitiva. Ele abre uma conversa entre curiosidade, conhecimento e futuro.</p><div class="slide-question">Obrigado! Agora queremos ouvir as perguntas da turma.</div></div><div class="team-slide-list"><div><span class="avatar avatar-mec">AW</span><span><b>Aghata Wanessa Lacerda Leite</b><small>Engenharia Mecânica</small></span></div><div><span class="avatar avatar-mec">AA</span><span><b>Andre Luiz Andrade de Oliveira</b><small>Engenharia Mecânica</small></span></div><div><span class="avatar avatar-civil">JN</span><span><b>Jhessica Ellen de Souza Nakano</b><small>Engenharia Civil</small></span></div><div><span class="avatar avatar-mec">MV</span><span><b>Mauro César Oliveira Venâncio</b><small>Engenharia Mecânica</small></span></div><div><span class="avatar avatar-ele">RB</span><span><b>Richard Gil Ferreira Brito</b><small>Engenharia Elétrica</small></span></div></div></section>'
];
let currentSlide=0;
function renderPresentationSlide() {
  root.querySelector('#presentation-stage').innerHTML = presentationSlides[currentSlide];
  root.querySelector('#slide-number').textContent = String(currentSlide + 1).padStart(2, '0') + ' / ' + String(presentationSlides.length).padStart(2, '0');
  root.querySelector('#slide-progress').style.width = (((currentSlide + 1) / presentationSlides.length) * 100) + '%';
  root.querySelector('#previous-slide').disabled = currentSlide === 0;
  const next = root.querySelector('#next-slide');
  const isLast = currentSlide === presentationSlides.length - 1;
  next.textContent = isLast ? '✓' : '→';
  next.setAttribute('aria-label', isLast ? 'Encerrar apresentação' : 'Próxima tela');
}

function openPresentation() {
  currentSlide = 0;
  renderPresentationSlide();
  root.querySelector('#presentation-dialog').showModal();

}

function closePresentation() {
  root.querySelector('#presentation-dialog').close();

}

function nextSlide() {
  if (currentSlide === presentationSlides.length - 1) {
    closePresentation();
    return;
  }
  currentSlide += 1;
  renderPresentationSlide();
}

function previousSlide() {
  if (currentSlide === 0) return;
  currentSlide -= 1;
  renderPresentationSlide();
}


root.querySelector('#open-presentation').addEventListener('click',openPresentation);
root.querySelector('#close-presentation').addEventListener('click',closePresentation);
root.querySelector('#next-slide').addEventListener('click',nextSlide);
root.querySelector('#previous-slide').addEventListener('click',previousSlide);
root.querySelector('.presentation-brand').addEventListener('click',e=>e.preventDefault());
root.addEventListener('keydown',event=>{
 if(!root.querySelector('#presentation-dialog').open)return;
 if(['ArrowRight','PageDown'].includes(event.key)){event.preventDefault();nextSlide()}
 if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();previousSlide()}
});

}
});
})();
</script>

</html>
